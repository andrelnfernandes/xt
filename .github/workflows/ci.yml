name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # New advisories come out without any push: the audit runs weekly too.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    # The weekly run is for the audit only.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

      - name: Upload xy.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: xy-windows-x86_64
          path: target/release/xy.exe

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Installed from crates.io on purpose: no third-party audit action.
      # Pinned, so that the tool that checks the dependencies is fixed too.
      - name: Audit dependencies
        run: cargo install cargo-audit --locked --version 0.22.2 && cargo audit
