name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # New advisories come out without any push: the audit runs weekly too.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    # The weekly run is for the audit only.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

      - name: Upload xy.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: xy-windows-x86_64
          path: target/release/xy.exe

  packages:
    # The .deb and the .rpm, built as the release builds them (x86_64 only),
    # so that a mistake in their metadata shows up here and not on the tag.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Packages
        run: sh packaging/linux/packages.sh x86_64-unknown-linux-musl

      # Installed for real and run: the .deb here, the .rpm in Fedora.
      - name: Install the .deb
        run: |
          dpkg-deb --info target/packages/*.deb
          sudo apt-get install -y --no-install-recommends ./target/packages/*.deb
          xy --version
          test -f /usr/share/man/man1/xy.1.gz
          test -f /usr/share/applications/xylem.desktop
          sudo apt-get remove -y xylem-fm
      - name: Install the .rpm
        run: |
          docker run --rm -v "$PWD/target/packages:/packages:ro" fedora:latest sh -euc '
            dnf install -y -q --setopt=install_weak_deps=False /packages/*.rpm
            xy --version
            test -f /usr/share/man/man1/xy.1.gz
            test -f /usr/share/applications/xylem.desktop
            dnf remove -y -q xylem-fm'

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-x86_64
          path: target/packages/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Installed from crates.io on purpose: no third-party audit action.
      # Pinned, so that the tool that checks the dependencies is fixed too.
      - name: Audit dependencies
        run: cargo install cargo-audit --locked --version 0.22.2 && cargo audit
