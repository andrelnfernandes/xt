name: Release

# Pushing a tag like v0.2.0 builds Xylem (xy) for Linux (x86_64 and ARM64, static)
# and Windows, publishes a GitHub release with the archives, the .deb and .rpm
# packages (Linux), their SHA-256 sums and the notes in
# .github/release-notes/<tag>.md (if any), and
# publishes the crate on crates.io (when the CARGO_REGISTRY_TOKEN secret is
# set).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes in .github/release-notes/<tag>.md, when there are some,
        # go above the list of pull requests that GitHub generates.
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          extra=()
          if [ -f "$notes" ]; then
            extra=(--notes-file "$notes")
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes "${extra[@]}" \
            --title "Xylem $GITHUB_REF_NAME"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive (Linux)
        if: runner.os != 'Windows'
        run: |
          name=xy-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/xy LICENSE README.md README.pt-BR.md "$name/"
          # The man page, generated by the binary just built (each runner
          # runs its own target).
          "target/${{ matrix.target }}/release/xy" --man > "$name/xy.1"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSETS=$name.tar.gz $name.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Packages (Linux)
        if: runner.os != 'Windows'
        run: |
          sh packaging/linux/packages.sh ${{ matrix.target }}
          echo "ASSETS=$ASSETS $(echo target/packages/*)" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name=xy-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/xy.exe LICENSE README.md README.pt-BR.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "ASSETS=$name.zip $name.zip.sha256" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" $ASSETS

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Publish on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN secret: skipping crates.io"
            exit 0
          fi
          cargo publish --locked
