[package]
name = "xt"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrelnfernandes/xt"
homepage = "https://github.com/andrelnfernandes/xt"
description = "Text-mode file manager inspired by XTree and ZTreeWin"
readme = "README.md"
keywords = ["file-manager", "xtree", "ztree", "tui", "terminal"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dunce = "1.0.5"
flate2 = "1.1.10"
globset = "0.4.20"
notify = { version = "8.2.0", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
tar = "0.4.46"
toml = "1.1.8"
toml_edit = "0.25.17"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"

# Binário de release menor e um pouco mais rápido.
[profile.release]
lto = true
codegen-units = 1
strip = true
